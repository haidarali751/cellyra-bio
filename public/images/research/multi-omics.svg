<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="researchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="researchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#B7FFB1;stop-opacity:0" />
    </radialGradient>
    <filter id="researchGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="400" fill="url(#researchGradient)"/>
  
  <!-- Multi-omics data visualization -->
  <g transform="translate(300, 200)" filter="url(#researchGlowFilter)">
    <!-- Central integrated data hub -->
    <circle cx="0" cy="0" r="70" fill="#08090B" stroke="#B7FFB1" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="55" fill="url(#researchGlow)" stroke="#8FFFA0" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="35" fill="#B7FFB1" opacity="0.1"/>
    <circle cx="0" cy="0" r="18" fill="#B7FFB1" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#B7FFB1" opacity="1"/>
    
    <!-- Omics layers radiating out -->
    <g fill="none" stroke-width="2" opacity="0.6">
      <!-- Genomics - outer ring -->
      <circle cx="0" cy="0" r="110" stroke="#B7FFB1" stroke-dasharray="8,4" opacity="0.4"/>
      <g transform="rotate(0)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(45)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(90)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(135)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(180)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(225)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(270)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      <g transform="rotate(315)">
        <path d="M110,0 L140,0" stroke="#B7FFB1" stroke-width="2"/>
        <circle cx="150" cy="0" r="6" fill="#B7FFB1" opacity="0.8"/>
      </g>
      
      <!-- Transcriptomics -->
      <circle cx="0" cy="0" r="140" stroke="#8FFFA0" stroke-dasharray="6,6" opacity="0.35"/>
      <g transform="rotate(22.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(67.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(112.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(157.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(202.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(247.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(292.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      <g transform="rotate(337.5)">
        <path d="M140,0 L170,0" stroke="#8FFFA0" stroke-width="1.5"/>
        <circle cx="180" cy="0" r="5" fill="#8FFFA0" opacity="0.7"/>
      </g>
      
      <!-- Proteomics -->
      <circle cx="0" cy="0" r="170" stroke="#4ECDC4" stroke-dasharray="4,8" opacity="0.3"/>
      <g transform="rotate(11.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(56.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(101.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(146.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(191.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(236.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(281.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
      <g transform="rotate(326.25)">
        <path d="M170,0 L195,0" stroke="#4ECDC4" stroke-width="1"/>
        <circle cx="205" cy="0" r="4" fill="#4ECDC4" opacity="0.6"/>
      </g>
    </g>
    
    <!-- Data flow particles between layers -->
    <g fill="#B7FFB1" opacity="0.5">
      <circle cx="80" cy="-40" r="2.5"/>
      <circle cx="100" cy="30" r="2"/>
      <circle cx="60" cy="80" r="2.5"/>
      <circle cx="-70" cy="50" r="2"/>
      <circle cx="-90" cy="-30" r="2.5"/>
      <circle cx="-40" cy="-90" r="2"/>
    </g>
  </g>
  
  <!-- Labels for omics layers -->
  <g font-family="monospace" font-size="9" fill="#8B918E" opacity="0.5">
    <text x="480" y="50" text-anchor="middle">GENOMICS</text>
    <text x="480" y="65" text-anchor="middle">DNA-seq</text>
    <text x="480" y="80" text-anchor="middle">Variants: 4.2M</text>
    
    <text x="520" y="150" text-anchor="middle">TRANSCRIPTOMICS</text>
    <text x="520" y="165" text-anchor="middle">RNA-seq</text>
    <text x="520" y="180" text-anchor="middle">Genes: 28K</text>
    
    <text x="520" y="250" text-anchor="middle">PROTEOMICS</text>
    <text x="520" y="265" text-anchor="middle">Mass spec</text>
    <text x="520" y="280" text-anchor="middle">Proteins: 12K</text>
    
    <text x="520" y="330" text-anchor="middle">METABOLOMICS</text>
    <text x="520" y="345" text-anchor="middle">LC-MS</text>
    <text x="520" y="360" text-anchor="middle">Metabolites: 1.8K</text>
  </g>
  
  <!-- Integration arrows -->
  <g stroke="#B7FFB1" stroke-width="1.5" opacity="0.3" stroke-dasharray="6,4">
    <path d="M300,100 Q350,100 380,120" fill="none"/>
    <path d="M300,150 Q350,150 380,160" fill="none"/>
    <path d="M300,200 Q350,200 380,190" fill="none"/>
    <path d="M300,250 Q350,250 380,230" fill="none"/>
    <path d="M300,300 Q350,300 380,280" fill="none"/>
  </g>
  
  <!-- Computational methods -->
  <g transform="translate(50, 200)">
    <rect x="0" y="-80" width="180" height="160" rx="12" fill="#0D1117" stroke="#B7FFB1" stroke-width="1" opacity="0.3"/>
    <text x="90" y="-55" font-family="monospace" font-size="11" fill="#B7FFB1" text-anchor="middle" font-weight="600">COMPUTATIONAL</text>
    <text x="90" y="-40" font-family="monospace" font-size="11" fill="#B7FFB1" text-anchor="middle" font-weight="600">METHODS</text>
    
    <g font-family="monospace" font-size="9" fill="#8B918E" opacity="0.7" text-anchor="middle">
      <text x="90" y="-10">• Graph neural nets</text>
      <text x="90" y="5">• Transformer models</text>
      <text x="90" y="20">• Bayesian inference</text>
      <text x="90" y="35">• Causal discovery</text>
      <text x="90" y="50">• Active learning</text>
      <text x="90" y="65">• Uncertainty quant.</text>
    </g>
  </g>
  
  <!-- Experimental validation -->
  <g transform="translate(370, 200)">
    <rect x="0" y="-80" width="180" height="160" rx="12" fill="#0D1117" stroke="#8FFFA0" stroke-width="1" opacity="0.3"/>
    <text x="90" y="-55" font-family="monospace" font-size="11" fill="#8FFFA0" text-anchor="middle" font-weight="600">EXPERIMENTAL</text>
    <text x="90" y="-40" font-family="monospace" font-size="11" fill="#8FFFA0" text-anchor="middle" font-weight="600">VALIDATION</text>
    
    <g font-family="monospace" font-size="9" fill="#8B918E" opacity="0.7" text-anchor="middle">
      <text x="90" y="-10">• CRISPR screens</text>
      <text x="90" y="5">• Organoid models</text>
      <text x="90" y="20">• Spatial transcript.</text>
      <text x="90" y="35">• Perturb-seq</text>
      <text x="90" y="50">• In vivo studies</text>
      <text x="90" y="65">• Clinical correlation</text>
    </g>
  </g>
</svg>