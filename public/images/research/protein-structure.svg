<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="proteinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#8FFFA0;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.5" />
    </linearGradient>
    <radialGradient id="atomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#B7FFB1;stop-opacity:0" />
    </radialGradient>
    <filter id="moleculeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bondGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background subtle grid -->
  <g stroke="#B7FFB1" stroke-width="0.3" opacity="0.05">
    <line x1="0" y1="0" x2="600" y2="0"/>
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="0" x2="0" y2="400"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  
  <!-- Protein secondary structure elements -->
  <!-- Alpha helix -->
  <g filter="url(#moleculeGlow)">
    <path d="M80 320 
      Q100 300 120 320
      Q140 340 160 320
      Q180 300 200 320
      Q220 340 240 320
      Q260 300 280 320
      Q300 340 320 320" 
      stroke="url(#proteinGradient)" 
      stroke-width="8" 
      fill="none" 
      stroke-linecap="round"
      opacity="0.8"/>
    
    <!-- Helix backbone ribbon -->
    <path d="M80 320 
      Q100 300 120 320
      Q140 340 160 320
      Q180 300 200 320
      Q220 340 240 320
      Q260 300 280 320
      Q300 340 320 320" 
      stroke="#08090B" 
      stroke-width="3" 
      fill="none" 
      stroke-linecap="round"
      opacity="0.6"/>
  </g>
  
  <!-- Beta sheets -->
  <g filter="url(#moleculeGlow)">
    <path d="M400 120 L520 120" stroke="#4ECDC4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M400 145 L520 145" stroke="#4ECDC4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M400 170 L520 170" stroke="#4ECDC4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M400 195 L520 195" stroke="#4ECDC4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Hydrogen bonds between beta strands -->
    <g stroke="#B7FFB1" stroke-width="1" stroke-dasharray="4,4" opacity="0.4">
      <line x1="420" y1="120" x2="420" y2="195"/>
      <line x1="460" y1="120" x2="460" y2="195"/>
      <line x1="500" y1="120" x2="500" y2="195"/>
    </g>
  </g>
  
  <!-- Small molecule / ligand binding -->
  <g transform="translate(300, 200)" filter="url(#moleculeGlow)">
    <!-- Central aromatic ring -->
    <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" 
             fill="none" stroke="#B7FFB1" stroke-width="2.5" opacity="0.8"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" 
             fill="#B7FFB1" opacity="0.1"/>
    
    <!-- Substituents -->
    <g stroke="#8FFFA0" stroke-width="2" opacity="0.7">
      <line x1="0" y1="-35" x2="0" y2="-55"/>
      <line x1="30" y1="-17.5" x2="50" y2="-17.5"/>
      <line x1="30" y1="17.5" x2="50" y2="17.5"/>
      <line x1="0" y1="35" x2="0" y2="55"/>
      <line x1="-30" y1="17.5" x2="-50" y2="17.5"/>
      <line x1="-30" y1="-17.5" x2="-50" y2="-17.5"/>
    </g>
    
    <!-- Terminal atoms -->
    <g fill="#B7FFB1" opacity="0.8">
      <circle cx="0" cy="-55" r="4"/>
      <circle cx="50" cy="-17.5" r="3.5"/>
      <circle cx="50" cy="17.5" r="3.5"/>
      <circle cx="0" cy="55" r="4"/>
      <circle cx="-50" cy="17.5" r="3.5"/>
      <circle cx="-50" cy="-17.5" r="3.5"/>
    </g>
    
    <!-- Glow rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#B7FFB1" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#4ECDC4" stroke-width="0.5" opacity="0.15"/>
  </g>
  
  <!-- Atomic spheres (CPK model style) -->
  <g filter="url(#moleculeGlow)">
    <!-- Carbon atoms -->
    <g fill="#2D2D2D" stroke="#B7FFB1" stroke-width="1" opacity="0.9">
      <circle cx="150" cy="80" r="14"/>
      <circle cx="200" cy="80" r="14"/>
      <circle cx="250" cy="80" r="14"/>
      <circle cx="150" cy="130" r="14"/>
      <circle cx="250" cy="130" r="14"/>
    </g>
    
    <!-- Nitrogen atoms -->
    <g fill="#3050F8" stroke="#8FFFA0" stroke-width="1" opacity="0.9">
      <circle cx="200" cy="30" r="13"/>
      <circle cx="200" cy="180" r="13"/>
    </g>
    
    <!-- Oxygen atoms -->
    <g fill="#FF0D0D" stroke="#4ECDC4" stroke-width="1" opacity="0.9">
      <circle cx="100" cy="80" r="12"/>
      <circle cx="300" cy="80" r="12"/>
      <circle cx="100" cy="130" r="12"/>
      <circle cx="300" cy="130" r="12"/>
    </g>
    
    <!-- Hydrogen atoms -->
    <g fill="#FFFFFF" stroke="#B7FFB1" stroke-width="0.5" opacity="0.6">
      <circle cx="130" cy="55" r="5"/>
      <circle cx="170" cy="55" r="5"/>
      <circle cx="230" cy="55" r="5"/>
      <circle cx="270" cy="55" r="5"/>
      <circle cx="130" cy="155" r="5"/>
      <circle cx="170" cy="155" r="5"/>
      <circle cx="230" cy="155" r="5"/>
      <circle cx="270" cy="155" r="5"/>
    </g>
  </g>
  
  <!-- Bonds between atoms -->
  <g stroke="#B7FFB1" stroke-width="3" opacity="0.5" filter="url(#bondGlow)">
    <line x1="150" y1="80" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="250" y2="80"/>
    <line x1="150" y1="80" x2="150" y2="130"/>
    <line x1="250" y1="80" x2="250" y2="130"/>
    <line x1="150" y1="80" x2="100" y2="80"/>
    <line x1="250" y1="80" x2="300" y2="80"/>
    <line x1="150" y1="130" x2="100" y2="130"/>
    <line x1="250" y1="130" x2="300" y2="130"/>
    <line x1="200" y1="80" x2="200" y2="30"/>
    <line x1="200" y1="130" x2="200" y2="180"/>
  </g>
  
  <!-- Floating measurement annotations -->
  <g font-family="monospace" font-size="10" fill="#B7FFB1" opacity="0.3">
    <text x="50" y="380">1.54 Å</text>
    <text x="450" y="380">1.24 Å</text>
    <text x="50" y="395">C-C</text>
    <text x="450" y="395">C=O</text>
  </g>
</svg>