<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helixGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8FFFA0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="helixGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8FFFA0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#B7FFB1;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B7FFB1;stop-opacity:0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <ellipse cx="200" cy="300" rx="180" ry="320" fill="url(#glowGradient)" opacity="0.4"/>
  
  <!-- DNA Helix Strands -->
  <g filter="url(#glow)">
    <!-- Strand 1 -->
    <path d="M200 20 
      Q280 80 280 180
      Q280 280 200 340
      Q120 400 120 500
      Q120 580 200 580" 
      stroke="url(#helixGradient1)" 
      stroke-width="3" 
      fill="none" 
      stroke-linecap="round"
      opacity="0.9"/>
    
    <!-- Strand 2 -->
    <path d="M200 20 
      Q120 80 120 180
      Q120 280 200 340
      Q280 400 280 500
      Q280 580 200 580" 
      stroke="url(#helixGradient2)" 
      stroke-width="3" 
      fill="none" 
      stroke-linecap="round"
      opacity="0.9"/>
  </g>
  
  <!-- Base pairs -->
  <g stroke="#B7FFB1" stroke-width="1.5" opacity="0.7">
    <line x1="150" y1="80" x2="250" y2="80" stroke-dasharray="4,4"/>
    <line x1="140" y1="140" x2="260" y2="140" stroke-dasharray="4,4"/>
    <line x1="150" y1="200" x2="250" y2="200" stroke-dasharray="4,4"/>
    <line x1="160" y1="260" x2="240" y2="260" stroke-dasharray="4,4"/>
    <line x1="150" y1="320" x2="250" y2="320" stroke-dasharray="4,4"/>
    <line x1="145" y1="380" x2="255" y2="380" stroke-dasharray="4,4"/>
    <line x1="150" y1="440" x2="250" y2="440" stroke-dasharray="4,4"/>
    <line x1="155" y1="500" x2="245" y2="500" stroke-dasharray="4,4"/>
    <line x1="160" y1="560" x2="240" y2="560" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Glowing nodes at intersections -->
  <g fill="#B7FFB1" filter="url(#glow)">
    <circle cx="200" cy="80" r="4" opacity="0.9"/>
    <circle cx="200" cy="140" r="4" opacity="0.9"/>
    <circle cx="200" cy="200" r="4" opacity="0.9"/>
    <circle cx="200" cy="260" r="4" opacity="0.9"/>
    <circle cx="200" cy="320" r="4" opacity="0.9"/>
    <circle cx="200" cy="380" r="4" opacity="0.9"/>
    <circle cx="200" cy="440" r="4" opacity="0.9"/>
    <circle cx="200" cy="500" r="4" opacity="0.9"/>
    <circle cx="200" cy="560" r="4" opacity="0.9"/>
  </g>
  
  <!-- Floating particles -->
  <g fill="#B7FFB1" opacity="0.5">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="340" cy="150" r="1.5"/>
    <circle cx="60" cy="250" r="2.5"/>
    <circle cx="360" cy="300" r="1"/>
    <circle cx="40" cy="400" r="2"/>
    <circle cx="370" cy="450" r="1.5"/>
    <circle cx="90" cy="520" r="2"/>
    <circle cx="330" cy="550" r="1"/>
  </g>
</svg>