<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08090B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111318;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="capGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B7FFB1;stop-opacity:0" />
    </radialGradient>
    <filter id="capGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="400" fill="url(#capGradient)"/>
  
  <!-- Four capability pillars -->
  <!-- 1. Computational Biology -->
  <g transform="translate(50, 50)" filter="url(#capGlowFilter)">
    <rect x="0" y="0" width="250" height="150" rx="16" fill="#111318" stroke="#B7FFB1" stroke-width="1" opacity="0.3"/>
    <ellipse cx="125" cy="50" rx="35" ry="35" fill="url(#capGlow)" stroke="#B7FFB1" stroke-width="1.5" opacity="0.3"/>
    
    <!-- DNA icon in circle -->
    <path d="M105 35 Q125 25 145 35 Q145 50 125 60 Q105 50 105 35" fill="none" stroke="#B7FFB1" stroke-width="2" opacity="0.8"/>
    <path d="M105 50 Q125 40 145 50 Q145 65 125 75 Q105 65 105 50" fill="none" stroke="#B7FFB1" stroke-width="2" opacity="0.8"/>
    <g stroke="#B7FFB1" stroke-width="1.5" opacity="0.6">
      <line x1="110" y1="40" x2="140" y2="40"/>
      <line x1="110" y1="50" x2="140" y2="50"/>
      <line x1="110" y1="60" x2="140" y2="60"/>
    </g>
    
    <text x="125" y="110" font-family="monospace" font-size="11" fill="#B7FFB1" text-anchor="middle" font-weight="600">COMPUTATIONAL</text>
    <text x="125" y="125" font-family="monospace" font-size="11" fill="#B7FFB1" text-anchor="middle" font-weight="600">BIOLOGY</text>
    
    <g font-family="monospace" font-size="8" fill="#8B918E" opacity="0.6" text-anchor="middle">
      <text x="125" y="140">Multi-omics analysis</text>
      <text x="125" y="150">Pathway modeling</text>
    </g>
  </g>
  
  <!-- 2. Molecular Engineering -->
  <g transform="translate(300, 50)" filter="url(#capGlowFilter)">
    <rect x="0" y="0" width="250" height="150" rx="16" fill="#111318" stroke="#8FFFA0" stroke-width="1" opacity="0.3"/>
    <ellipse cx="125" cy="50" rx="35" ry="35" fill="url(#capGlow)" stroke="#8FFFA0" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Protein structure icon -->
    <g transform="translate(125, 50)">
      <ellipse cx="-15" cy="-10" rx="12" ry="8" fill="none" stroke="#8FFFA0" stroke-width="2" opacity="0.8"/>
      <ellipse cx="15" cy="-10" rx="12" ry="8" fill="none" stroke="#8FFFA0" stroke-width="2" opacity="0.8"/>
      <ellipse cx="0" cy="10" rx="12" ry="8" fill="none" stroke="#8FFFA0" stroke-width="2" opacity="0.8"/>
      <line x1="-15" y1="-10" x2="0" y2="10" stroke="#8FFFA0" stroke-width="2" opacity="0.8"/>
      <line x1="15" y1="-10" x2="0" y2="10" stroke="#8FFFA0" stroke-width="2" opacity="0.8"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#8FFFA0" stroke-width="2" opacity="0.8"/>
    </g>
    
    <text x="125" y="110" font-family="monospace" font-size="11" fill="#8FFFA0" text-anchor="middle" font-weight="600">MOLECULAR</text>
    <text x="125" y="125" font-family="monospace" font-size="11" fill="#8FFFA0" text-anchor="middle" font-weight="600">ENGINEERING</text>
    
    <g font-family="monospace" font-size="8" fill="#8B918E" opacity="0.6" text-anchor="middle">
      <text x="125" y="140">De novo design</text>
      <text x="125" y="150">Structure prediction</text>
    </g>
  </g>
  
  <!-- 3. Precision Therapeutics -->
  <g transform="translate(50, 200)" filter="url(#capGlowFilter)">
    <rect x="0" y="0" width="250" height="150" rx="16" fill="#111318" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
    <ellipse cx="125" cy="50" rx="35" ry="35" fill="url(#capGlow)" stroke="#4ECDC4" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Target/therapeutic icon -->
    <g transform="translate(125, 50)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#4ECDC4" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#4ECDC4" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#4ECDC4" opacity="0.8"/>
      <g stroke="#4ECDC4" stroke-width="2" opacity="0.8">
        <line x1="0" y1="-22" x2="0" y2="-28"/>
        <line x1="0" y1="22" x2="0" y2="28"/>
        <line x1="-22" y1="0" x2="-28" y2="0"/>
        <line x1="22" y1="0" x2="28" y2="0"/>
      </g>
    </g>
    
    <text x="125" y="110" font-family="monospace" font-size="11" fill="#4ECDC4" text-anchor="middle" font-weight="600">PRECISION</text>
    <text x="125" y="125" font-family="monospace" font-size="11" fill="#4ECDC4" text-anchor="middle" font-weight="600">THERAPEUTICS</text>
    
    <g font-family="monospace" font-size="8" fill="#8B918E" opacity="0.6" text-anchor="middle">
      <text x="125" y="140">Target identification</text>
      <text x="125" y="150">Patient stratification</text>
    </g>
  </g>
  
  <!-- 4. Synthetic Biology -->
  <g transform="translate(300, 200)" filter="url(#capGlowFilter)">
    <rect x="0" y="0" width="250" height="150" rx="16" fill="#111318" stroke="#B7FFB1" stroke-width="1" opacity="0.3"/>
    <ellipse cx="125" cy="50" rx="35" ry="35" fill="url(#capGlow)" stroke="#B7FFB1" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Circuit/genetic circuit icon -->
    <g transform="translate(125, 50)" stroke="#B7FFB1" stroke-width="2" opacity="0.8">
      <!-- Promoter -->
      <path d="M-30 0 Q-20 -10 -10 0 Q-20 10 -30 0" fill="none"/>
      <!-- RBS -->
      <rect x="-8" y="-6" width="16" height="12" rx="2" fill="none"/>
      <!-- CDS -->
      <rect x="10" y="-10" width="30" height="20" rx="3" fill="none"/>
      <!-- Terminator -->
      <path d="M45 -15 L55 0 L45 15" fill="none"/>
      <path d="M40 -15 L50 0 L40 15" fill="none" opacity="0.5"/>
    </g>
    
    <text x="125" y="110" font-family="monospace" font-size="11" fill="#B7FFB1" text-anchor="middle" font-weight="600">SYNTHETIC</text>
    <text x="125" y="125" font-family="monospace" font-size="11" fill="#B7FFB1" text-anchor="middle" font-weight="600">BIOLOGY</text>
    
    <g font-family="monospace" font-size="8" fill="#8B918E" opacity="0.6" text-anchor="middle">
      <text x="125" y="140">Genetic circuits</text>
      <text x="125" y="150">Metabolic engineering</text>
    </g>
  </g>
  
  <!-- Connecting lines between capabilities -->
  <g stroke="#B7FFB1" stroke-width="0.5" opacity="0.1" stroke-dasharray="6,4">
    <line x1="300" y1="125" x2="300" y2="200"/>
    <line x1="175" y1="125" x2="300" y2="125"/>
    <line x1="175" y1="275" x2="300" y2="275"/>
  </g>
</svg>