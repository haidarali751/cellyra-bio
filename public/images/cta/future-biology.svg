<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ctaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08090B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111318;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ctaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B7FFB1;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#8FFFA0;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="ctaCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#B7FFB1;stop-opacity:0" />
    </radialGradient>
    <filter id="ctaGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ctaInnerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#B7FFB1" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  
  <rect width="600" height="400" fill="url(#ctaGradient)"/>
  <rect width="600" height="400" fill="url(#gridPattern)"/>
  
  <!-- Large central biological form -->
  <g transform="translate(300, 200)" filter="url(#ctaGlowFilter)">
    <!-- Outer organic boundary -->
    <path d="M0,-120 
      Q50,-110 90,-80
      Q120,-50 140,-10
      Q150,20 130,60
      Q110,90 70,110
      Q30,120 -10,130
      Q-50,135 -90,110
      Q-120,85 -130,40
      Q-140,-10 -120,-50
      Q-100,-80 -50,-110
      Z" 
      fill="url(#ctaGlow)" stroke="#B7FFB1" stroke-width="1.5" opacity="0.25"/>
    
    <!-- Middle boundary -->
    <path d="M0,-90 
      Q40,-85 70,-60
      Q90,-30 100,0
      Q105,25 90,50
      Q70,70 30,85
      Q0,90 -20,80
      Q-50,70 -70,40
      Q-85,10 -90,-20
      Q-90,-50 -70,-70
      Q-40,-85 0,-90
      Z" 
      fill="url(#ctaCoreGlow)" stroke="#B7FFB1" stroke-width="1" opacity="0.3"/>
    
    <!-- Inner core - biological engine -->
    <ellipse cx="0" cy="0" rx="45" ry="35" fill="#08090B" stroke="#B7FFB1" stroke-width="2" opacity="0.6" filter="url(#ctaInnerGlow)"/>
    <ellipse cx="0" cy="0" rx="35" ry="28" fill="url(#ctaGlow)" stroke="#8FFFA0" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#B7FFB1" opacity="0.15"/>
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#B7FFB1" opacity="0.4"/>
    <circle cx="0" cy="0" r="5" fill="#B7FFB1" opacity="1"/>
    
    <!-- Orbiting elements -->
    <g filter="url(#ctaInnerGlow)">
      <circle cx="80" cy="-30" r="8" fill="#B7FFB1" opacity="0.7"/>
      <circle cx="-70" cy="-50" r="6" fill="#8FFFA0" opacity="0.7"/>
      <circle cx="-60" cy="60" r="7" fill="#4ECDC4" opacity="0.7"/>
      <circle cx="70" cy="50" r="5" fill="#B7FFB1" opacity="0.7"/>
    </g>
    
    <!-- Orbit paths -->
    <g fill="none" stroke="#B7FFB1" stroke-width="0.5" opacity="0.15" stroke-dasharray="6,4">
      <ellipse cx="0" cy="0" rx="85" ry="60" transform="rotate(-20)"/>
      <ellipse cx="0" cy="0" rx="70" ry="75" transform="rotate(30)"/>
    </g>
  </g>
  
  <!-- DNA helices on sides -->
  <g transform="translate(80, 200)" filter="url(#ctaGlowFilter)">
    <path d="M0,0 
      Q-20,-30 -20,-60
      Q-20,-90 0,-120
      Q20,-90 20,-60
      Q20,-30 0,0" 
      stroke="url(#ctaGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,0 
      Q20,-30 20,-60
      Q20,-90 0,-120
      Q-20,-90 -20,-60
      Q-20,-30 0,0" 
      stroke="url(#ctaCoreGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <g stroke="#B7FFB1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
      <line x1="-10" y1="-20" x2="10" y2="-20"/>
      <line x1="-12" y1="-50" x2="12" y2="-50"/>
      <line x1="-10" y1="-80" x2="10" y2="-80"/>
      <line x1="-8" y1="-110" x2="8" y2="-110"/>
    </g>
  </g>
  
  <g transform="translate(520, 200)" filter="url(#ctaGlowFilter)">
    <path d="M0,0 
      Q-20,-30 -20,-60
      Q-20,-90 0,-120
      Q20,-90 20,-60
      Q20,-30 0,0" 
      stroke="url(#ctaGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,0 
      Q20,-30 20,-60
      Q20,-90 0,-120
      Q-20,-90 -20,-60
      Q-20,-30 0,0" 
      stroke="url(#ctaCoreGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <g stroke="#B7FFB1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
      <line x1="-10" y1="-20" x2="10" y2="-20"/>
      <line x1="-12" y1="-50" x2="12" y2="-50"/>
      <line x1="-10" y1="-80" x2="10" y2="-80"/>
      <line x1="-8" y1="-110" x2="8" y2="-110"/>
    </g>
  </g>
  
  <!-- Floating scientific notation -->
  <g font-family="monospace" font-size="9" fill="#B7FFB1" opacity="0.25">
    <text x="50" y="50">ATCG</text>
    <text x="520" y="50">GCTA</text>
    <text x="30" y="380">α-helix</text>
    <text x="500" y="380">β-sheet</text>
    <text x="100" y="100">K<sub>d</sub></text>
    <text x="480" y="100">IC<sub>50</sub></text>
    <text x="80" y="350">ΔG</text>
    <text x="500" y="350">K<sub>m</sub></text>
  </g>
  
  <!-- Bottom accent line -->
  <g transform="translate(300, 350)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#B7FFB1" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#B7FFB1" opacity="0.8"/>
    <circle cx="-20" cy="0" r="2" fill="#8FFFA0" opacity="0.6"/>
    <circle cx="20" cy="0" r="2" fill="#4ECDC4" opacity="0.6"/>
  </g>
  
  <!-- Corner accents -->
  <g stroke="#B7FFB1" stroke-width="1.5" opacity="0.2">
    <path d="M30,30 L80,30 M30,30 L30,80"/>
    <path d="M570,30 L520,30 M570,30 L570,80"/>
    <path d="M30,370 L80,370 M30,370 L30,320"/>
    <path d="M570,370 L520,370 M570,370 L570,320"/>
  </g>
</svg>